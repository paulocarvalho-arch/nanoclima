<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nano.Clima — Estação Meteorológica</title>

<style>

    --primary-dark: #0369a1;
    --accent: #f97316;
    --success: #10b981;

<body>
<div class="container">
  <header>
    <div class="logo">☀️ Nano.Clima</div>
    <div class="subtitle">Estação Meteorológica Inteligente</div>
    <div class="timestamp">
      <span class="status-dot"></span>
      <span id="timestamp">Carregando...</span>
    </div>
  </header>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Buscando dados das últimas 24 horas...</p>
    </div>
  </div>

  <footer>
    <p>Desenvolvido pela <strong>EQUIPE CÃO</strong></p>
    <p style="margin-top: 0.5rem; font-size: 0.75rem;">
      ETo: Hargreaves-Samani · Previsão: Open-Meteo · Atualização a cada 15 min
    </p>
  </footer>

<script>
// ==========================================
// CONFIGURAÇÕES
// ==========================================
const CONFIG = {
  channel: '3124909',
  latitude: -9.3982,      // Petrolina/PE
  longitude: -40.5026,    // Petrolina/PE
  kc: 1.00,
  eficiencia: 0.90,
  refreshInterval: 15 * 60 * 1000
};

// ==========================================
// CÁLCULO DE ETo (Hargreaves-Samani)
// ==========================================
function calcularETo(tMax, tMin, lat, kc, ef) {
  const J = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const delta = 0.409 * Math.sin((2 * Math.PI / 365) * J - 1.39);
  const latRad = lat * Math.PI / 180;
  const ws = Math.acos(-Math.tan(latRad) * Math.tan(delta));
  const dr = 1 + 0.033 * Math.cos((2 * Math.PI / 365) * J);
  const Ra = (24 * 60 / Math.PI) * 0.0820 * dr * 
    (ws * Math.sin(latRad) * Math.sin(delta) + 
     Math.cos(latRad) * Math.cos(delta) * Math.sin(ws));
  const tMean = (tMax + tMin) / 2.0;
  const eto = 0.0023 * Ra * (tMean + 17.8) * Math.sqrt(Math.max(0, tMax - tMin));
  const lamina = (eto * kc) / ef;
  return { eto: eto.toFixed(2), lamina: lamina.toFixed(2) };
}

// ==========================================
// PREVISÃO DE CHUVA (Open-Meteo)
// ==========================================
async function buscarPrevisaoChuva() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&daily=precipitation_sum,precipitation_probability_max,weathercode&timezone=America%2FSao_Paulo&forecast_days=7`;
  try {
    const resp = await fetch(url);
    const data = await resp.json();
    return data.daily;
  } catch (err) {
    console.warn('Falha na previsão:', err);
    return null;
  }
}

// ==========================================
// FORMATAÇÃO DE DATA
// ==========================================
function formatarDataBR(date) {
  return date.toLocaleString('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function formatarDiaSemana(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo', weekday: 'short' }).replace('.', '');
}

// ==========================================
// BUSCA DE DADOS NO THINGSPEAK
// ==========================================
async function buscarDados() {
  const fim = new Date();
  const inicio = new Date(fim.getTime() - 24 * 60 * 60 * 1000);
  const url = `https://api.thingspeak.com/channels/${CONFIG.channel}/feeds.json?results=500&start=${inicio.toISOString()}&end=${fim.toISOString()}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!data.feeds || data.feeds.length === 0) throw new Error('Sem dados disponíveis');
  return data.feeds;
}

// ==========================================
// RENDERIZAÇÃO
// ==========================================
async function renderizar(feeds, previsao) {
  const ultima = feeds[feeds.length - 1];
  const temps = feeds.map(f => parseFloat(f.field1)).filter(t => !isNaN(t));
  
  const tAtual = parseFloat(ultima.field1);
  const umidade = parseFloat(ultima.field2);
  const pressao = parseFloat(ultima.field3);
  const tMin = Math.min(...temps);
  const tMax = Math.max(...temps);
  const uMin = Math.min(...feeds.map(f => parseFloat(f.field2)).filter(u => !isNaN(u)));
  const uMax = Math.max(...feeds.map(f => parseFloat(f.field2)).filter(u => !isNaN(u)));
  const pMin = Math.min(...feeds.map(f => parseFloat(f.field3)).filter(p => !isNaN(p)));
  const pMax = Math.max(...feeds.map(f => parseFloat(f.field3)).filter(p => !isNaN(p)));
  
  const { eto, lamina } = calcularETo(tMax, tMin, CONFIG.latitude, CONFIG.kc, CONFIG.eficiencia);
  
  document.getElementById('timestamp').textContent = 
    `Atualizado em ${formatarDataBR(new Date())}`;
  
  document.getElementById('content').innerHTML = `
    <!-- CARDS DE MEDIÇÕES -->
    <div class="grid">
      <div class="card">
        <div class="card-icon">🌡️</div>
        <div class="card-label">Temperatura Atual</div>
        <div class="card-value">${tAtual.toFixed(1)}<span class="card-unit">°C</span></div>
        <div class="minmax-row">
          <div class="minmax-item">
            <div class="minmax-label">Mínima 24h</div>
            <div class="minmax-value min-min">${tMin.toFixed(1)}°C</div>
          </div>
          <div class="minmax-item">
            <div class="minmax-label">Máxima 24h</div>
            <div class="minmax-value min-max">${tMax.toFixed(1)}°C</div>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-icon">💧</div>
        <div class="card-label">Umidade Relativa</div>
        <div class="card-value">${umidade.toFixed(0)}<span class="card-unit">%</span></div>
        <div class="minmax-row">
          <div class="minmax-item">
            <div class="minmax-label">Mínima 24h</div>
            <div class="minmax-value min-min">${uMin.toFixed(0)}%</div>
          </div>
          <div class="minmax-item">
            <div class="minmax-label">Máxima 24h</div>
            <div class="minmax-value min-max">${uMax.toFixed(0)}%</div>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-icon">💨</div>
        <div class="card-label">Pressão Atmosférica</div>
        <div class="card-value">${pressao.toFixed(0)}<span class="card-unit">hPa</span></div>
        <div class="minmax-row">
          <div class="minmax-item">
            <div class="minmax-label">Mínima 24h</div>
            <div class="minmax-value min-min">${pMin.toFixed(0)}</div>
          </div>
          <div class="minmax-item">
            <div class="minmax-label">Máxima 24h</div>
            <div class="minmax-value min-max">${pMax.toFixed(0)}</div>
          </div>
        </div>
      </div>
      
      <div class="card eto">
        <div class="card-icon">☀️</div>
        <div class="card-label">Evapotranspiração (ETo)</div>
        <div class="card-value">${eto}<span class="card-unit">mm/dia</span></div>
        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
          Método Hargreaves-Samani
        </div>
      </div>
      
      <div class="card">
        <div class="card-icon">📊</div>
        <div class="card-label">Leituras (24h)</div>
        <div class="card-value">${feeds.length}</div>
        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
          ${feeds.length < 50 ? '⚠️ Poucas leituras' : '✅ Amostragem boa'}
        </div>
      </div>
    </div>
    
    <!-- RECOMENDAÇÃO DE IRRIGAÇÃO (SIMPLIFICADA) -->
    <div class="recommendation-card">
      <div class="rec-header">
        <div class="rec-icon">💧</div>
        <div>
          <div class="rec-title">Lâmina de Irrigação para Hoje</div>
          <div class="rec-subtitle">Quantidade de água a aplicar na cultura</div>
        </div>
      </div>
      
      <div class="rec-main">
        <div class="rec-main-label">Aplique hoje</div>
        <div class="rec-main-value">
          ${lamina}<span class="rec-main-unit">mm/dia</span>
        </div>
        
        <div class="rec-formula">
          <div class="rec-formula-item">
            ETo: <strong>${eto} mm</strong>
          </div>
          <div class="rec-formula-item">
            Kc: <strong>${CONFIG.kc.toFixed(2)}</strong>
          </div>
          <div class="rec-formula-item">
            Eficiência: <strong>${(CONFIG.eficiencia*100).toFixed(0)}%</strong>
          </div>
        </div>
      </div>
      
      <div class="rec-tip">
        <div class="rec-tip-icon">🌅</div>
        <div class="rec-tip-text">
          <div class="rec-tip-title">Melhor horário para irrigar</div>
          <div class="rec-tip-desc">
            Entre <strong>4h e 7h da manhã</strong> — menor evaporação, menos vento e a planta absorve a água com mais eficiência ao longo do dia.
          </div>
        </div>
      </div>
    </div>
    
    <!-- GRÁFICO PRINCIPAL: TEMPERATURA -->
    <div class="chart-card">
      <div class="chart-title">🌡️ Evolução da Temperatura — Últimas 24h</div>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>
    
    <!-- GRÁFICOS SECUNDÁRIOS: UMIDADE E PRESSÃO -->
    <div class="charts-grid">
      <div class="chart-card compact">
        <div class="chart-title">💧 Umidade Relativa — Últimas 24h</div>
        <div class="chart-container">
          <canvas id="umidChart"></canvas>
        </div>
      </div>
      <div class="chart-card compact">
        <div class="chart-title">💨 Pressão Atmosférica — Últimas 24h</div>
        <div class="chart-container">
          <canvas id="pressChart"></canvas>
        </div>
      </div>
    </div>
    
    <!-- PREVISÃO 7 DIAS -->
    ${previsao ? `
    <div class="forecast-card">
      <div class="forecast-title">📅 Previsão de Chuva — Próximos 7 dias (Petrolina/PE)</div>
      <div class="forecast-container">
        <canvas id="forecastChart"></canvas>
      </div>
    </div>
    ` : ''}
  `;
  
  desenharGraficos(feeds, previsao);
}

// ==========================================
// GRÁFICOS
// ==========================================
function criarGradiente(ctx, cor) {
  const g = ctx.createLinearGradient(0, 0, 0, 300);
  g.addColorStop(0, cor.replace('1)', '0.4)'));
  g.addColorStop(1, cor.replace('1)', '0)'));
  return g;
}

function configBase(ticksY) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: 'rgba(15, 23, 42, 0.9)',
        titleColor: '#f1f5f9',
        bodyColor: '#f1f5f9',
        borderColor: 'rgba(255,255,255,0.1)',
        borderWidth: 1,
        padding: 12,
        cornerRadius: 8
      }
    },
    scales: {
      x: {
        ticks: { color: '#94a3b8', maxTicksLimit: 8 },
        grid: { color: 'rgba(255,255,255,0.05)' }
      },
      y: {
        ticks: { color: '#94a3b8', callback: ticksY },
        grid: { color: 'rgba(255,255,255,0.05)' }
      }
    }
  };
}

function desenharGraficos(feeds, previsao) {
  const labels = feeds.map(f => {
    const d = new Date(f.created_at);
    return d.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
  });
  
  // Temperatura
  const ctxT = document.getElementById('tempChart').getContext('2d');
  new Chart(ctxT, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Temperatura (°C)',
        data: feeds.map(f => parseFloat(f.field1)),
        borderColor: '#f97316',
        backgroundColor: criarGradiente(ctxT, 'rgba(249, 115, 22, 1)'),
        borderWidth: 2, fill: true, tension: 0.4,
        pointRadius: 0, pointHoverRadius: 5
      }]
    },
    options: configBase(v => v + '°C')
  });
  
  // Umidade
  const ctxU = document.getElementById('umidChart').getContext('2d');
  new Chart(ctxU, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Umidade (%)',
        data: feeds.map(f => parseFloat(f.field2)),
        borderColor: '#38bdf8',
        backgroundColor: criarGradiente(ctxU, 'rgba(56, 189, 248, 1)'),
        borderWidth: 2, fill: true, tension: 0.4,
        pointRadius: 0, pointHoverRadius: 5
      }]
    },
    options: configBase(v => v + '%')
  });
  
  // Pressão
  const ctxP = document.getElementById('pressChart').getContext('2d');
  new Chart(ctxP, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Pressão (hPa)',
        data: feeds.map(f => parseFloat(f.field3)),
        borderColor: '#10b981',
        backgroundColor: criarGradiente(ctxP, 'rgba(16, 185, 129, 1)'),
        borderWidth: 2, fill: true, tension: 0.4,
        pointRadius: 0, pointHoverRadius: 5
      }]
    },
    options: configBase(v => v + ' hPa')
  });
  
  // Previsão 7 dias
  if (previsao) {
    const ctxF = document.getElementById('forecastChart').getContext('2d');
    const dias = previsao.time.map(d => formatarDiaSemana(d));
    const chuva = previsao.precipitation_sum.map(v => v || 0);
    const prob = previsao.precipitation_probability_max.map(v => v || 0);
    
    new Chart(ctxF, {
      type: 'bar',
      data: {
        labels: dias,
        datasets: [
          {
            label: 'Chuva (mm)',
            data: chuva,
            backgroundColor: 'rgba(56, 189, 248, 0.7)',
            borderColor: '#38bdf8',
            borderWidth: 1,
            borderRadius: 6,
            yAxisID: 'y'
          },
          {
            label: 'Probabilidade (%)',
            data: prob,
            type: 'line',
            borderColor: '#f97316',
            backgroundColor: 'rgba(249, 115, 22, 0.1)',
            borderWidth: 2,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: '#f97316',
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#94a3b8' }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.9)',
            titleColor: '#f1f5f9',
            bodyColor: '#f1f5f9',
            padding: 12,
            cornerRadius: 8
          }
        },
        scales: {
          x: {
            ticks: { color: '#94a3b8' },
            grid: { color: 'rgba(255,255,255,0.05)' }
          },
          y: {
            position: 'left',
            title: { display: true, text: 'mm', color: '#94a3b8' },
            ticks: { color: '#94a3b8' },
            grid: { color: 'rgba(255,255,255,0.05)' },
            beginAtZero: true
          },
          y1: {
            position: 'right',
            title: { display: true, text: '%', color: '#94a3b8' },
            ticks: { color: '#f97316' },
            grid: { display: false },
            min: 0, max: 100
          }
        }
      }
    });
  }
}

// ==========================================
// INICIALIZAÇÃO
// ==========================================
async function iniciar() {
  try {
    const [feeds, previsao] = await Promise.all([
      buscarDados(),
      buscarPrevisaoChuva()
    ]);
    await renderizar(feeds, previsao);
  } catch (err) {
    document.getElementById('content').innerHTML = 
      `<div class="error">❌ ${err.message}</div>`;
  }
}

iniciar();
setInterval(iniciar, CONFIG.refreshInterval);
</script>
